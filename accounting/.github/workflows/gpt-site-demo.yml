name: Build GPT Site demo

on:
  push:
    branches: [26fincom_v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt-site-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/26fincom_v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check release files
        run: python -B tools/check_release.py
      - name: Test JavaScript
        run: node --test tests/*.test.mjs
      - name: Test Python
        run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Export static demo
        run: |
          python -B tools/build_static_site.py --output dist-demo
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('dist-demo/source-version.json').write_text(json.dumps({
              'repository': os.environ['GITHUB_REPOSITORY'],
              'branch': '26fincom_v2',
              'commit_sha': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: finpilot-gpt-site
          path: dist-demo/
          if-no-files-found: error
          retention-days: 30
